<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SG Overlay – Starting Soon Mockup</title>
<link rel="stylesheet" href="shared.css">
<style>
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .brand { width: 260px; height: 260px; animation: rise .6s ease-out both; filter: drop-shadow(0 10px 40px rgba(155,77,255,.35)); }
  .wrap .eyebrow { margin-top: 18px; animation: rise .6s .1s ease-out both; }
  h1 { font-size: 96px; font-weight: 900; letter-spacing: -2px; margin-top: 6px; animation: rise .6s .2s ease-out both; }
  h1 span { background: linear-gradient(90deg, var(--sg), var(--sg-glow)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .countdown { font-size: 64px; font-weight: 800; letter-spacing: 2px; margin-top: 4px; color: #fff; animation: rise .6s .3s ease-out both; }

  .matchup { display: flex; align-items: center; gap: 36px; margin-top: 56px; padding: 22px 40px;
             background: var(--panel); border: 1px solid var(--line); border-radius: 16px; animation: rise .6s .4s ease-out both; }
  .team { display: flex; align-items: center; gap: 18px; width: 380px; }
  .team.r { flex-direction: row-reverse; text-align: right; }
  .team .tag { font-size: 34px; font-weight: 800; }
  .team .name { font-size: 16px; color: var(--muted); font-weight: 500; margin-top: 2px; }
  .team .team-logo { width: 84px; height: 84px; }
  .team .logo-ph { width: 84px; height: 84px; font-size: 22px; }
  .vs { text-align: center; width: 120px; }
  .vs .v { font-size: 28px; font-weight: 900; color: var(--dim); }
  .vs .fmt { font-size: 12px; font-weight: 700; letter-spacing: 2px; color: var(--muted); margin-top: 4px; }
  .team.l { border-left: 4px solid var(--sg); padding-left: 18px; }
  .team.r { border-right: 4px solid var(--opp); padding-right: 18px; }

  .footer { position: absolute; left: 60px; right: 60px; bottom: 44px; display: flex; justify-content: space-between; align-items: center;
            font-size: 16px; color: var(--muted); animation: fade 1s .6s both; }
  .footer b { color: var(--text); font-weight: 700; }
  .footer .dotsep { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--dim); margin: 0 12px; vertical-align: middle; }
</style>
</head>
<body>
<div id="stage">
  <div class="scene-bg"></div>
  <div class="wrap">
    <img class="brand team-logo" src="assets/saargaming-logo.png" alt="SaarGaming">
    <div class="eyebrow"><b>Prime League</b> · Division 4 · Matchday 5</div>
    <h1>Starting <span>Soon</span></h1>
    <div class="countdown" id="cd">05:00</div>

    <div class="matchup">
      <div class="team l">
        <img class="team-logo" src="assets/saargaming-logo.png" alt="">
        <div><div class="tag">SG</div><div class="name">SaarGaming</div></div>
      </div>
      <div class="vs"><div class="v">VS</div><div class="fmt">BEST OF 3</div></div>
      <div class="team r">
        <div class="logo-ph">NLE</div>
        <div><div class="tag">NLE</div><div class="name">Nordlicht Esports</div></div>
      </div>
    </div>
  </div>
  <div class="footer">
    <span>Caster <b>Mattes</b></span>
    <span>Website<span class="dotsep"></span>Discord<span class="dotsep"></span>Socials (set in admin panel)</span>
  </div>
</div>
<script src="shared.js"></script>
<script>
  // Dummy countdown; in the real overlay the target time comes from the admin panel
  let left = 300;
  const cd = document.getElementById('cd');
  setInterval(() => {
    left = Math.max(0, left - 1);
    cd.textContent = left ? `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}` : 'LIVE SOON';
  }, 1000);
</script>
</body>
</html>
