<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SG Overlay – Post-Game Mockup</title>
<link rel="stylesheet" href="shared.css">
<style>
  .page { position: absolute; inset: 0; animation: fade .5s ease-out both; }
  .page.off { display: none; }

  /* ---------- Header (both pages) ---------- */
  .head { position: absolute; top: 36px; left: 42px; right: 42px; height: 110px; display: grid; grid-template-columns: 1fr 380px 1fr; align-items: center; }
  .ht { display: flex; align-items: center; gap: 20px; }
  .ht.r { flex-direction: row-reverse; text-align: right; }
  .ht .team-logo, .ht .logo-ph { width: 86px; height: 86px; }
  .ht .logo-ph { font-size: 22px; }
  .ht .res { font-size: 46px; font-weight: 900; letter-spacing: 1px; line-height: 1; }
  .ht .tn { font-size: 17px; color: var(--muted); margin-top: 6px; font-weight: 500; }
  .ht.win .res { background: linear-gradient(90deg, var(--sg), var(--sg-glow)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ht.loss .res { color: var(--dim); }
  .hc { text-align: center; }
  .hc .score { font-size: 48px; font-weight: 900; letter-spacing: 2px; line-height: 1; margin: 8px 0 6px; }
  .hc .score .s { color: var(--sg); } .hc .score .o { color: var(--opp); } .hc .score .d { color: var(--dim); margin: 0 10px; }
  .hc .series { font-size: 13px; font-weight: 800; letter-spacing: 2px; color: var(--sg-glow); }

  /* ---------- Team stat strip ---------- */
  .strip { position: absolute; top: 172px; left: 42px; right: 42px; height: 70px; display: flex; justify-content: center; gap: 12px; }
  .ts { width: 240px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 16px; }
  .ts .a, .ts .b { font-size: 24px; font-weight: 800; }
  .ts .a { color: var(--sg); } .ts .b { color: var(--text); text-align: right; opacity: .8; }
  .ts .k { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--dim); text-align: center; padding: 0 8px; }
  .ts .drk { display: flex; gap: 3px; }
  .ts .drk i { width: 11px; height: 11px; transform: rotate(45deg); border-radius: 2px; display: block; }

  /* ---------- Player table ---------- */
  .table { position: absolute; top: 266px; left: 42px; right: 42px; background: var(--panel); border: 1px solid var(--line);
           border-radius: 14px; padding: 8px 0; }
  .colhead, .prow { display: grid; grid-template-columns: 1fr 70px 1fr; }
  .colhead { height: 26px; align-items: center; }
  .colhead .h { display: grid; grid-template-columns: 56px 150px 90px 54px 64px 54px 50px 1fr; gap: 10px; padding: 0 18px;
                font-size: 10px; font-weight: 700; letter-spacing: 1.4px; color: var(--dim); }
  .colhead .h.r { direction: rtl; }
  .colhead .h span:last-child { text-align: left; }
  .prow { height: 68px; align-items: center; border-top: 1px solid var(--line); }
  .ph { display: grid; grid-template-columns: 56px 150px 90px 54px 64px 54px 50px 1fr; gap: 10px; align-items: center; padding: 0 18px; }
  .ph.r { direction: rtl; }
  .ph > * { direction: ltr; }
  .ph .ch img { width: 52px; height: 52px; border-radius: 8px; display: block; }
  .ph .nm { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ph .nm small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 2px; }
  .ph .v { font-size: 16px; font-weight: 700; }
  .ph .v.mut { color: var(--muted); font-weight: 600; }
  .ph.r .nm, .ph.r .v { text-align: right; }
  .ph .its { display: flex; gap: 3px; }
  .ph.r .its { justify-content: flex-start; }
  .ph .its img, .ph .its .e { width: 30px; height: 30px; border-radius: 5px; display: block; }
  .ph .its .e { background: rgba(255,255,255,.06); }
  .prole { text-align: center; font-size: 10px; font-weight: 800; letter-spacing: 1.4px; color: var(--dim); }
  .prow .ph.l { border-left: 3px solid var(--sg); } .prow .ph.r { border-right: 3px solid var(--opp); }

  /* ---------- Gold graph ---------- */
  .graph { position: absolute; left: 42px; right: 42px; top: 672px; bottom: 36px; background: var(--panel);
           border: 1px solid var(--line); border-radius: 14px; padding: 18px 24px 10px; }
  .graph .gh { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .graph .gh .legend { font-size: 13px; color: var(--muted); display: flex; gap: 18px; }
  .graph .gh .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .graph svg { display: block; }
  .graph text { font-family: Inter, sans-serif; font-size: 11px; fill: var(--dim); font-weight: 600; }

  /* ---------- Page 2: lane head-to-head ---------- */
  .p2title { position: absolute; top: 166px; left: 0; right: 0; text-align: center; }
  .lanes { position: absolute; top: 200px; left: 42px; right: 42px; bottom: 40px; display: flex; flex-direction: column; gap: 12px; }
  .lane { flex: 1; display: grid; grid-template-columns: 360px 1fr 360px; align-items: center; background: var(--panel);
          border: 1px solid var(--line); border-radius: 14px; padding: 0 22px; }
  .lp { display: flex; align-items: center; gap: 16px; }
  .lp.r { flex-direction: row-reverse; text-align: right; }
  .lp img { width: 72px; height: 72px; border-radius: 10px; }
  .lp .nm { font-size: 22px; font-weight: 800; }
  .lp .nm small { display: block; font-size: 14px; color: var(--muted); font-weight: 500; margin-top: 3px; }
  .lp .lr { font-size: 11px; font-weight: 800; letter-spacing: 1.6px; color: var(--dim); margin-bottom: 4px; }
  .lp.l { border-left: 4px solid var(--sg); padding-left: 16px; } .lp.r { border-right: 4px solid var(--opp); padding-right: 16px; }
  .cmp { display: grid; grid-template-columns: repeat(5, 1fr); gap: 22px; padding: 0 24px; }
  .c .lbl { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; color: var(--dim); margin-bottom: 8px; }
  .c .vals { display: flex; justify-content: space-between; font-size: 24px; font-weight: 800; }
  .c .vals .w { color: var(--text); } .c .vals .lo { color: var(--dim); }
  .c .bar { position: relative; height: 8px; margin-top: 8px; background: rgba(255,255,255,.06); border-radius: 3px; overflow: hidden; }
  .c .bar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.3); }
  .c .bar i { position: absolute; top: 0; bottom: 0; display: block; }
  .c .bar i.sg { right: 50%; background: var(--sg); } .c .bar i.opp { left: 50%; background: var(--opp); }

  .pager { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  .pager i { width: 22px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.15); display: block; }
  .pager i.on { background: var(--sg); }
</style>
</head>
<body>
<div id="stage">
  <div class="scene-bg"></div>

  <div class="head">
    <div class="ht win">
      <img class="team-logo" src="assets/saargaming-logo.png" alt="">
      <div><div class="res">VICTORY</div><div class="tn">SaarGaming</div></div>
    </div>
    <div class="hc">
      <div class="eyebrow">Game 2 · <b>31:42</b></div>
      <div class="score"><span class="s">2</span><span class="d">–</span><span class="o">0</span></div>
      <div class="series">SAARGAMING WIN THE SERIES</div>
    </div>
    <div class="ht r loss">
      <div class="logo-ph">NLE</div>
      <div><div class="res">DEFEAT</div><div class="tn">Nordlicht Esports</div></div>
    </div>
  </div>

  <!-- ===== Page 1: overview ===== -->
  <div class="page" id="p1">
    <div class="strip">
      <div class="ts"><div class="a">24</div><div class="k">KILLS</div><div class="b">11</div></div>
      <div class="ts"><div class="a">62.3k</div><div class="k">GOLD</div><div class="b">51.0k</div></div>
      <div class="ts"><div class="a">9</div><div class="k">TOWERS</div><div class="b">2</div></div>
      <div class="ts"><div class="a drk"><i style="background:#ff6a3d"></i><i style="background:#3db8ff"></i><i style="background:#3df0e0"></i><i style="background:#ff6a3d"></i></div><div class="k">DRAGONS</div><div class="b drk" style="justify-content:flex-end"><i style="background:#c9a46a"></i></div></div>
      <div class="ts"><div class="a">4</div><div class="k">GRUBS</div><div class="b">2</div></div>
      <div class="ts"><div class="a">1</div><div class="k">BARONS</div><div class="b">0</div></div>
    </div>

    <div class="table">
      <div class="colhead">
        <div class="h"><span></span><span>PLAYER</span><span>KDA</span><span>CS</span><span>GOLD</span><span>KP</span><span>VIS</span><span>ITEMS</span></div>
        <div></div>
        <div class="h r"><span></span><span>PLAYER</span><span>KDA</span><span>CS</span><span>GOLD</span><span>KP</span><span>VIS</span><span>ITEMS</span></div>
      </div>
      <div id="rows"></div>
    </div>

    <div class="graph">
      <div class="gh">
        <div class="eyebrow">Gold difference</div>
        <div class="legend"><span><i style="background:var(--sg)"></i>SaarGaming ahead</span><span><i style="background:var(--opp)"></i>Nordlicht ahead</span><span>◆ Dragon · ★ Baron</span></div>
      </div>
      <svg id="chart" width="1786" height="300"></svg>
    </div>
  </div>

  <!-- ===== Page 2: lane head-to-head ===== -->
  <div class="page off" id="p2">
    <div class="eyebrow p2title">Lane <b>head to head</b></div>
    <div class="lanes" id="lanes"></div>
  </div>

  <div class="pager"><i class="on" id="pg1"></i><i id="pg2"></i></div>
</div>
<script src="shared.js"></script>
<script>
  // Dummy end-of-game data (sources: last Live Client snapshot + OCR gold history kept by the backend)
  const DD = 'https://ddragon.leagueoflegends.com/cdn/15.1.1/img';
  const roles = ['TOP', 'JGL', 'MID', 'BOT', 'SUP'];
  const SGK = 24, OPK = 11;
  const sg = [
    ['Steinbeißer', 'Aatrox',  [6,2,7],  287, 13.4, 24, [6692,3047,3071,6333,3053,3026], 0.6],
    ['Moosrücken',  'Sejuani', [3,3,14], 198, 10.9, 41, [3068,3047,6665,3075,4401,3143], 0.9],
    ['Saarlicht',   'Ahri',    [9,2,8],  301, 14.6, 28, [6655,3020,4645,3089,3135,3157], 1.4],
    ['Panzerkralle','Jinx',    [6,3,9],  342, 15.2, 19, [3031,3006,3094,3036,3072,3026], 0.2],
    ['Schildkröte', 'Nautilus',[0,1,19], 41,  8.2,  88, [3190,3117,3050,3109,3107,2065], 0.3],
  ];
  const opp = [
    ['Polarfuchs',  'Renekton',[2,5,3],  251, 11.0, 18, [6610,3111,3071,3053,6333], 0],
    ['Eiswind',     'LeeSin',  [4,5,4],  175, 10.2, 37, [6692,3111,3071,3156], 0],
    ['Nordstern',   'Syndra',  [3,6,3],  268, 11.4, 22, [6655,3020,4645,3089], 0],
    ['Kaltfront',   'Kaisa',   [2,4,4],  301, 11.6, 15, [3124,3006,3115,4645], 0],
    ['Polarlicht',  'Rakan',   [0,4,7],  36,  6.8,  71, [3190,3117,3107,3050], 0],
  ];
  const champName = { LeeSin: 'Lee Sin', Kaisa: "Kai'Sa" };
  const its = ids => [...ids, ...Array(6 - ids.length).fill(0)].map(id => id ? `<img src="${DD}/item/${id}.png" alt="">` : '<div class="e"></div>').join('');
  const half = (p, side, teamKills) => {
    const [n, c, [k, d, a], cs, g, vis, items] = p;
    return `<div class="ph ${side}">
      <div class="ch"><img src="${DD}/champion/${c}.png" alt=""></div>
      <div class="nm">${n}<small>${champName[c] || c}</small></div>
      <div class="v">${k} / ${d} / ${a}</div>
      <div class="v">${cs}</div>
      <div class="v">${g.toFixed(1)}k</div>
      <div class="v mut">${Math.round((k + a) / teamKills * 100)}%</div>
      <div class="v mut">${vis}</div>
      <div class="its">${its(items)}</div>
    </div>`;
  };
  document.getElementById('rows').innerHTML = sg.map((p, i) =>
    `<div class="prow">${half(p, 'l', SGK)}<div class="prole">${roles[i]}</div>${half(opp[i], 'r', OPK)}</div>`).join('');

  // Gold difference chart (SG minus NLE, in k, one point per minute)
  const gd = [0,0,.1,.2,.1,-.2,-.5,-.3,.2,.6,.9,1.2,.8,1.5,2.1,1.9,2.6,3.0,2.4,2.9,3.4,4.1,3.8,4.6,5.5,7.4,7.9,8.6,9.1,10.2,11.0,11.3];
  const ev = [[6,'d','#c9a46a','opp'],[12,'d','#ff6a3d','sg'],[18,'d','#3db8ff','sg'],[23,'d','#3df0e0','sg'],[25,'b','#b07cff','sg'],[29,'d','#ff6a3d','sg']];
  const W = 1786, H = 300, L = 44, B = 22, T = 8, max = 15;
  const x = m => L + m / 31.7 * (W - L - 8);
  const y = v => T + (max - v) / (2 * max) * (H - T - B);
  let s = '';
  for (const v of [-10, -5, 0, 5, 10]) {
    s += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,${v ? .06 : .25})"/>`;
    s += `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v > 0 ? '+' : ''}${v}k</text>`;
  }
  for (let m = 0; m <= 30; m += 5) s += `<text x="${x(m)}" y="${H - 4}" text-anchor="middle">${m}:00</text>`;
  const pts = gd.map((v, m) => `${x(m)},${y(v)}`).join(' ');
  const area = `${x(0)},${y(0)} ${pts} ${x(gd.length - 1)},${y(0)}`;
  s += `<defs><clipPath id="up"><rect x="0" y="0" width="${W}" height="${y(0)}"/></clipPath>
        <clipPath id="dn"><rect x="0" y="${y(0)}" width="${W}" height="${H}"/></clipPath></defs>`;
  s += `<polygon points="${area}" fill="rgba(155,77,255,.28)" clip-path="url(#up)"/>`;
  s += `<polygon points="${area}" fill="rgba(229,72,77,.28)" clip-path="url(#dn)"/>`;
  s += `<polyline points="${pts}" fill="none" stroke="var(--sg)" stroke-width="2.5" clip-path="url(#up)"/>`;
  s += `<polyline points="${pts}" fill="none" stroke="var(--opp)" stroke-width="2.5" clip-path="url(#dn)"/>`;
  for (const [m, t, c, team] of ev) {
    const cx = x(m), cy = team === 'sg' ? y(max) + 10 : y(-max) - 10;
    s += t === 'd'
      ? `<rect x="${cx - 5}" y="${cy - 5}" width="10" height="10" fill="${c}" transform="rotate(45 ${cx} ${cy})" rx="1.5"/>`
      : `<text x="${cx}" y="${cy + 5}" text-anchor="middle" style="fill:${c};font-size:15px">★</text>`;
    s += `<line x1="${cx}" x2="${cx}" y1="${y(max) + 18}" y2="${y(-max) - 18}" stroke="rgba(255,255,255,.07)" stroke-dasharray="3 4"/>`;
  }
  s += `<circle cx="${x(gd.length - 1)}" cy="${y(gd[gd.length - 1])}" r="4.5" fill="var(--sg)"/>`;
  s += `<text x="${x(gd.length - 1) - 12}" y="${y(gd[gd.length - 1]) + 22}" text-anchor="end" style="fill:#fff;font-size:14px;font-weight:800">+11.3k</text>`;
  document.getElementById('chart').innerHTML = s;

  // Page 2: lane head-to-head, values compared as diverging bars
  const cmp = (lbl, a, b, fmt = v => v) => {
    const tot = Math.abs(a) + Math.abs(b) || 1, diff = (a - b) / tot;
    return `<div class="c"><div class="lbl">${lbl}</div>
      <div class="vals"><span class="${a >= b ? 'w' : 'lo'}">${fmt(a)}</span><span class="${b > a ? 'w' : 'lo'}">${fmt(b)}</span></div>
      <div class="bar">${diff ? `<i class="${diff > 0 ? 'sg' : 'opp'}" style="width:${Math.min(Math.abs(diff) * 50 * 2, 50)}%"></i>` : ''}</div></div>`;
  };
  const kda = ([k, d, a]) => ((k + a) / Math.max(d, 1));
  document.getElementById('lanes').innerHTML = sg.map((p, i) => {
    const o = opp[i];
    return `<div class="lane">
      <div class="lp l"><img src="${DD}/champion/${p[1]}.png" alt=""><div><div class="lr">${roles[i]}</div><div class="nm">${p[0]}<small>${champName[p[1]] || p[1]} · ${p[2].join(' / ')}</small></div></div></div>
      <div class="cmp">
        ${cmp('GOLD @15', 5.9 + p[7], 5.9, v => v.toFixed(1) + 'k')}
        ${cmp('GOLD', p[4], o[4], v => v.toFixed(1) + 'k')}
        ${cmp('CS', p[3], o[3])}
        ${cmp('KDA', kda(p[2]), kda(o[2]), v => v.toFixed(1))}
        ${cmp('VISION', p[5], o[5])}
      </div>
      <div class="lp r"><img src="${DD}/champion/${o[1]}.png" alt=""><div><div class="lr">${roles[i]}</div><div class="nm">${o[0]}<small>${champName[o[1]] || o[1]} · ${o[2].join(' / ')}</small></div></div></div>
    </div>`;
  }).join('');

  // Page switch: P key (real overlay: hotkey / admin panel, optional auto-rotate)
  const show = n => {
    document.getElementById('p1').classList.toggle('off', n !== 1);
    document.getElementById('p2').classList.toggle('off', n !== 2);
    document.getElementById('pg1').classList.toggle('on', n === 1);
    document.getElementById('pg2').classList.toggle('on', n === 2);
  };
  let page = new URLSearchParams(location.search).get('page') === '2' ? 2 : 1;
  show(page);
  addEventListener('keydown', e => { if (e.key === 'p' || e.key === 'P') show(page = page === 1 ? 2 : 1); });
</script>
</body>
</html>
